# Cricket AI Council - Docker Compose

services:
  # FastAPI Backend
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Streamlit UI
  ui:
    image: streamlit/streamlit:latest
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    volumes:
      - ./ui/streamlit_app.py:/app/streamlit_app.py
    command: streamlit run streamlit_app.py --server.address=0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Chroma DB (for RAG)
  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - ./data/chroma_db:/chroma/chroma
    restart: unless-stopped
